<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B83FF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="checkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51CF66"/>
      <stop offset="100%" stop-color="#2F9E44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>

  <!-- T — horizontal bar -->
  <rect x="100" y="128" width="312" height="58" rx="29" fill="white" filter="url(#shadow)"/>

  <!-- T — vertical bar -->
  <rect x="227" y="128" width="58" height="228" rx="29" fill="white"/>

  <!-- Check badge -->
  <circle cx="256" cy="386" r="52" fill="url(#checkBg)" filter="url(#shadow)"/>
  <circle cx="256" cy="386" r="52" fill="none" stroke="white" stroke-width="5" stroke-opacity="0.4"/>
  <!-- Checkmark -->
  <polyline
    points="232,386 248,403 282,366"
    fill="none"
    stroke="white"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
