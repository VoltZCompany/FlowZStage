<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B83FF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="checkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51CF66"/>
      <stop offset="100%" stop-color="#2F9E44"/>
    </linearGradient>
  </defs>

  <!-- Icon box -->
  <rect width="48" height="48" rx="12" fill="url(#iconBg)"/>

  <!-- T horizontal bar -->
  <rect x="9" y="11" width="30" height="6" rx="3" fill="white"/>
  <!-- T vertical bar -->
  <rect x="21" y="11" width="6" height="21" rx="3" fill="white"/>

  <!-- Check badge -->
  <circle cx="24" cy="38" r="6" fill="url(#checkG)"/>
  <polyline points="20.5,38 23,40.5 28,35" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text
    x="58"
    y="31"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#1A1A2E"
  >Tesla</text>
</svg>
