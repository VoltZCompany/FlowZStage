<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Roteiro da Equipe</title>
<link rel="manifest" href="/manifest-equipe.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roteiro">
<meta name="theme-color" content="#0A1628" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F0F2F8" media="(prefers-color-scheme: light)">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" as="script">
<script>try{if(localStorage.getItem('equipe_dark')==='1')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{
  --blue:#0A84FF;--blue-light:#E5F0FF;--blue-dark:#0060CC;
  --ink:#0A0F1A;--ink2:#3C3C50;--ink3:#6E6E82;
  --surface:#FFFFFF;--bg:#F0F2F8;--border:#E4E6EF;
  --green:#30D158;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --orange:#FF9F0A;--orange-bg:#FFF7E6;
  --purple:#BF5AF2;--purple-bg:#F5EEFF;
  --topbar-bg:rgba(255,255,255,.96);
  --transition:1.6s ease;
}
html.dark{
  --ink:#F2F2F7;--ink2:#C7C7CC;--ink3:#8E8E93;
  --surface:#1C1C1E;--bg:#000000;--border:#38383A;
  --blue-light:rgba(10,132,255,.18);
  --green-bg:rgba(48,209,88,.12);--green-border:rgba(48,209,88,.3);
  --orange-bg:rgba(255,159,10,.12);
  --purple-bg:rgba(191,90,242,.12);
  --topbar-bg:rgba(28,28,30,.96);
}
html,body{background:var(--bg);min-height:100vh;transition:background var(--transition)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--ink);font-size:14.5px;line-height:1.6;padding-top:64px;padding-bottom:32px;transition:color var(--transition)}
/* Sora para display */
.hero-name,.hero-badge,.hc-val,.sec-title,.tb-title,.pin-title,.dep-time,.van-plate,.loc-code,.leg-time,.leg-city{font-family:'Sora',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--topbar-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1.5px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:200;transition:background var(--transition),border-color var(--transition)}
.tb-title{flex:1;text-align:center;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;transition:color var(--transition)}
.tb-dark-toggle{width:44px;height:28px;background:var(--border);border:none;border-radius:99px;cursor:pointer;position:relative;transition:background var(--transition);flex-shrink:0;padding:0}
.tb-dark-toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--transition),background var(--transition)}
html.dark .tb-dark-toggle{background:var(--blue)}
html.dark .tb-dark-toggle::after{transform:translateX(16px)}

/* ─── Rain overlay ─── */
.rain{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:2}
.drop{position:absolute;top:-20px;width:1.5px;background:rgba(255,255,255,0.22);border-radius:99px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px)}100%{transform:translateY(calc(100vh + 40px))}}
.drop:nth-child(1){left:3%;height:14px;animation-duration:1.7s;animation-delay:0s}
.drop:nth-child(2){left:8%;height:16px;animation-duration:2.1s;animation-delay:.3s}
.drop:nth-child(3){left:13%;height:12px;animation-duration:1.9s;animation-delay:.7s}
.drop:nth-child(4){left:18%;height:18px;animation-duration:1.6s;animation-delay:.1s}
.drop:nth-child(5){left:24%;height:13px;animation-duration:2.3s;animation-delay:.5s}
.drop:nth-child(6){left:29%;height:15px;animation-duration:1.8s;animation-delay:.9s}
.drop:nth-child(7){left:35%;height:17px;animation-duration:2.0s;animation-delay:.2s}
.drop:nth-child(8){left:40%;height:12px;animation-duration:1.7s;animation-delay:.6s}
.drop:nth-child(9){left:46%;height:16px;animation-duration:2.2s;animation-delay:.4s}
.drop:nth-child(10){left:52%;height:14px;animation-duration:1.9s;animation-delay:.8s}
.drop:nth-child(11){left:57%;height:18px;animation-duration:1.6s;animation-delay:.15s}
.drop:nth-child(12){left:62%;height:13px;animation-duration:2.1s;animation-delay:.55s}
.drop:nth-child(13){left:67%;height:15px;animation-duration:1.8s;animation-delay:.35s}
.drop:nth-child(14){left:72%;height:17px;animation-duration:2.0s;animation-delay:.75s}
.drop:nth-child(15){left:76%;height:12px;animation-duration:1.7s;animation-delay:.2s}
.drop:nth-child(16){left:81%;height:16px;animation-duration:2.3s;animation-delay:.6s}
.drop:nth-child(17){left:85%;height:14px;animation-duration:1.9s;animation-delay:.0s}
.drop:nth-child(18){left:89%;height:18px;animation-duration:2.1s;animation-delay:.45s}
.drop:nth-child(19){left:93%;height:13px;animation-duration:1.8s;animation-delay:.85s}
.drop:nth-child(20){left:97%;height:15px;animation-duration:2.0s;animation-delay:.25s}

/* ─── Fade-in animations ─── */
.fade-in{opacity:0;transform:translateY(16px);transition:opacity 0.45s ease,transform 0.45s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}

/* ─── Button shimmer (só ativa no hover via background-position) ─── */
.waze-btn{
  background:linear-gradient(105deg,#00BCD4 0%,#00BCD4 38%,rgba(255,255,255,.28) 50%,#00BCD4 62%,#00BCD4 100%);
  background-size:300% 100%;background-position:0% center;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .14s ease,background-position .55s ease;
}
.waze-btn:hover{transform:scale(1.04);box-shadow:0 6px 22px rgba(0,188,212,.32);background-position:100% center}
.waze-btn:active{transform:scale(.9)}
.copy-btn{position:relative;overflow:hidden}
.copy-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(10,132,255,.14) 50%,transparent 70%);background-size:300% 100%;background-position:0% center;pointer-events:none;transition:background-position .45s ease;border-radius:inherit}
.copy-btn:hover::after{background-position:100% center}

/* ─── Copy button ─── */
.copy-btn{background:transparent;border:1.5px solid var(--border);border-radius:99px;padding:5px 13px;font-size:11px;font-weight:700;color:var(--ink3);cursor:pointer;transition:border-color .18s,color .18s,background .18s;font-family:'Inter',sans-serif;letter-spacing:.1px}
.copy-btn:hover{border-color:var(--blue);color:var(--blue)}
.copy-btn:active{transform:scale(0.92)}
.copy-btn.copied{background:var(--green-bg);border-color:var(--green);color:#166534}

/* ─── PIN key ripple ─── */
.pin-key{position:relative;overflow:hidden}
.pin-key::after{content:'';position:absolute;inset:0;background:var(--blue);opacity:0;transform:scale(0);border-radius:inherit;pointer-events:none;transition:none}
.pin-key:active::after{opacity:.13;transform:scale(1);transition:transform .14s ease,opacity .14s ease}

/* ─── Urgent pulse glow ─── */
@keyframes pulse-glow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 12px var(--orange)}}
.dep-time.urgent{animation:pulse-glow 2s ease-in-out infinite}

/* ─── Scroll-to-top button ─── */
.scroll-top{position:fixed;bottom:24px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:20px;cursor:pointer;opacity:0;transition:opacity 0.3s;z-index:9000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(10,132,255,.35);transform:translateZ(0);-webkit-transform:translateZ(0)}
.scroll-top.visible{opacity:1}
.scroll-top:active{opacity:.7}

/* ─── PIN overlay ─── */
#pin-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:0;transition:opacity .35s ease,transform .35s ease;overflow:hidden}
#pin-overlay.hide{opacity:0;transform:scale(1.04);pointer-events:none}
/* Orbis premium — blobs aurora */
@keyframes blobA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-24px) scale(1.08)}}
@keyframes blobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-22px,20px) scale(1.12)}}
@keyframes blobC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(16px,28px) scale(.92)}}
@keyframes blobD{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14px,-18px) scale(1.06)}}
.pin-orbis{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.pin-orbit{position:absolute;border-radius:50%;filter:blur(72px);opacity:.22}
.pin-orbit:nth-child(1){width:320px;height:320px;top:-80px;left:50%;margin-left:-160px;background:radial-gradient(circle,#0A84FF 0%,transparent 70%);animation:blobA 9s ease-in-out infinite}
.pin-orbit:nth-child(2){width:260px;height:260px;bottom:60px;left:-60px;background:radial-gradient(circle,#BF5AF2 0%,transparent 70%);animation:blobB 11s ease-in-out infinite}
.pin-orbit:nth-child(3){width:220px;height:220px;bottom:80px;right:-50px;background:radial-gradient(circle,#00C7BE 0%,transparent 70%);animation:blobC 8s ease-in-out infinite}
.pin-orbit:nth-child(4){width:180px;height:180px;top:30%;right:-20px;background:radial-gradient(circle,#5E5CE6 0%,transparent 70%);animation:blobD 13s ease-in-out infinite}
html.dark .pin-orbit{opacity:.45}
.pin-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
.pin-title{font-size:24px;font-weight:900;letter-spacing:-.6px;color:var(--ink);margin-bottom:6px;text-align:center}
.pin-sub{font-size:14px;color:var(--ink3);margin-bottom:36px;text-align:center}
.pin-dots{display:flex;gap:14px;margin-bottom:28px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:background .15s,border-color .15s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue)}
.pin-dot.err{background:#FF3B30;border-color:#FF3B30}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;width:100%;margin-bottom:24px}
.pin-key{height:64px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);font-size:22px;font-weight:600;color:var(--ink);cursor:pointer;font-family:'Sora',sans-serif;transition:transform .08s cubic-bezier(.34,1.56,.64,1),background .12s;-webkit-tap-highlight-color:transparent;user-select:none}
.pin-key:active{transform:scale(.88);background:var(--blue-light)}
.pin-key.del{font-size:18px}
.pin-key.enter{background:var(--blue);color:#fff;border-color:var(--blue);font-size:20px}
.pin-key.enter:active{transform:scale(.9)}
.pin-err{font-size:13px;font-weight:700;color:#FF3B30;height:18px;text-align:center;margin-top:4px}
@keyframes pin-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pin-dots.shake{animation:pin-shake .35s ease}

@media print{
  .topbar,.no-print,.scroll-top{display:none!important}
  body{padding-top:0;padding-bottom:0;background:#fff}
  .wrap{max-width:100%;padding:0}
  .hero{border-radius:0;margin-bottom:16px}
  .sec,.flight-sec{page-break-inside:avoid;margin-bottom:10px}
  .leg-card{page-break-inside:avoid}
  .fade-in{opacity:1;transform:none}
}
@keyframes heroSlide{0%{background-position:0% 50%}40%{background-position:80% 30%}70%{background-position:100% 70%}100%{background-position:0% 50%}}
.hero{background:linear-gradient(135deg,#16082A 0%,#0A1035 18%,#0D2060 36%,#16082A 50%,#1A0838 64%,#0A1428 80%,#0A0A20 100%);background-size:300% 300%;animation:heroSlide 12s ease-in-out infinite;color:#fff;border-radius:22px;padding:28px 24px 24px;margin-bottom:14px;position:relative;overflow:hidden}
@keyframes artOrb1{0%{transform:translate(0,0) scale(1)}35%{transform:translate(22px,-18px) scale(1.14)}70%{transform:translate(-12px,20px) scale(.88)}100%{transform:translate(0,0) scale(1)}}
@keyframes artOrb2{0%{transform:translate(0,0) scale(1)}40%{transform:translate(-28px,16px) scale(1.2)}80%{transform:translate(16px,-22px) scale(.9)}100%{transform:translate(0,0) scale(1)}}
@keyframes artOrb3{0%{transform:translate(0,0) scale(.9)}50%{transform:translate(18px,22px) scale(1.12)}100%{transform:translate(0,0) scale(.9)}}
@keyframes artOrb4{0%{transform:translate(0,0)}45%{transform:translate(-16px,-18px) scale(1.08)}100%{transform:translate(0,0)}}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(60px)}
.hero-orb1{width:240px;height:240px;background:rgba(255,159,10,.18);top:-70px;right:5%;animation:artOrb1 9s ease-in-out infinite}
.hero-orb2{width:200px;height:200px;background:rgba(191,90,242,.2);bottom:-60px;left:-10%;animation:artOrb2 12s ease-in-out infinite 1.6s}
.hero-orb3{width:220px;height:220px;background:rgba(255,100,150,.12);top:20%;left:-40px;animation:artOrb3 10s ease-in-out infinite 0.9s}
.hero-orb4{width:160px;height:160px;background:rgba(255,159,10,.15);bottom:-20px;right:-5%;animation:artOrb4 14s ease-in-out infinite 3.1s}
.hero-inner{position:relative;z-index:2}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(10,132,255,.35);border:1px solid rgba(10,132,255,.5);font-size:10px;font-weight:900;letter-spacing:2px;padding:5px 12px;border-radius:99px;margin-bottom:14px;text-transform:uppercase}
/* VerifiedBadge — starburst */
@keyframes vbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes vbSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.vb-wrap{display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:default}
.vb-core{position:relative;width:28px;height:28px;animation:vbPulse 1.8s ease-in-out infinite}
.vb-sq{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:5px;background:#007AFF}
.vb-sq.r0{transform:rotate(0deg)}.vb-sq.r22{transform:rotate(22.5deg)}.vb-sq.r45{transform:rotate(45deg)}.vb-sq.r67{transform:rotate(67.5deg)}
.vb-ck{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;fill:none}
/* MalaCuia card */
@keyframes mcIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes mcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes mcSwift{0%{left:-80%}60%,100%{left:130%}}
.mala-cuia-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:row;align-items:center;gap:12px;animation:mcIn .5s cubic-bezier(.34,1.56,.64,1) both;position:relative;overflow:hidden}
html:not(.dark) .mala-cuia-card{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08)}
.mala-cuia-card::before{content:'';position:absolute;top:0;bottom:0;left:-80%;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:mcSwift 3.5s ease-in-out infinite;pointer-events:none}
html:not(.dark) .mala-cuia-card::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.mc-icon{font-size:30px;line-height:1;animation:mcPulse 2.4s ease-in-out infinite;flex-shrink:0}
.mc-body{flex:1;min-width:0}
.mc-title{font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--ink1, var(--ink));margin-bottom:2px;font-family:'Sora',sans-serif}
.mc-sub{font-size:11px;color:var(--ink3);font-weight:500}
.hero-name{font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.1;text-align:center;margin-bottom:5px}
.hero-city{font-size:14px;opacity:.85;text-align:center;font-weight:500;margin-bottom:18px}
.hero-divider{height:1px;background:rgba(255,255,255,.15);margin-bottom:16px}
.hero-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.hero-col{text-align:center;padding:4px 8px;border-right:1px solid rgba(255,255,255,.15)}
.hero-col:last-child{border-right:none}
.hc-lbl{font-size:9px;font-weight:900;letter-spacing:1.8px;opacity:.55;text-transform:uppercase;margin-bottom:5px}
.hc-val{font-size:17px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.hc-sub{font-size:11px;opacity:.65;margin-top:3px;font-weight:500}
.sec{background:var(--surface);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 1px 8px rgba(0,0,0,.04);transition:background var(--transition),border-color var(--transition)}
.sec-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink3);margin-bottom:16px;display:flex;align-items:center;gap:6px;transition:color var(--transition)}
/* ─── Flight — boarding pass ─── */
@keyframes planeFly{0%,100%{transform:translate(-50%,-60%) translateX(-4px)}50%{transform:translate(-50%,-60%) translateX(4px)}}
.flight-card{background:#0D1526;border:1px solid rgba(255,255,255,.08);border-radius:22px;overflow:hidden;margin-bottom:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
html:not(.dark) .flight-card{background:#EEF3FF;border-color:rgba(10,30,100,.1)}
.fc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 13px;border-bottom:1px solid rgba(255,255,255,.07)}
html:not(.dark) .fc-head{border-bottom-color:rgba(0,0,0,.07)}
.fc-label{font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5)}
html:not(.dark) .fc-label{color:rgba(0,0,0,.4)}
.fc-fnum{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;font-family:'Courier New',monospace}
html:not(.dark) .fc-fnum{color:rgba(0,0,0,.3)}
.fc-route{padding:22px 20px 20px}
.fc-strip{display:flex;align-items:flex-start;gap:0}
.fc-airport{flex:1;min-width:0}
.fc-airport.right{text-align:right}
.fc-iata{font-family:'Courier New',monospace;font-size:42px;font-weight:900;letter-spacing:-2px;line-height:1;color:#fff}
html:not(.dark) .fc-iata{color:#0A0A1E}
.fc-city{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}
html:not(.dark) .fc-city{color:rgba(0,0,0,.4)}
.fc-date-row{font-size:10px;color:rgba(255,255,255,.3);font-weight:600;letter-spacing:.5px;margin-bottom:4px;text-transform:uppercase}
html:not(.dark) .fc-date-row{color:rgba(0,0,0,.3)}
.fc-time{font-family:'Courier New',monospace;font-size:26px;font-weight:900;letter-spacing:-1px;color:#FF9F0A;margin-top:12px;line-height:1}
.fc-time.arr{color:rgba(255,255,255,.88)}
html:not(.dark) .fc-time.arr{color:#0A0A1E}
.fc-mid{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.fc-track{position:relative;width:100%;height:2px;background:linear-gradient(90deg,rgba(255,159,10,.6),rgba(255,255,255,.2));border-radius:2px;margin:8px 0}
.fc-plane{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);font-size:13px;animation:planeFly 2.6s ease-in-out infinite}
.fc-direct{font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:4px}
html:not(.dark) .fc-direct{color:rgba(0,0,0,.2)}
.fc-tear{position:relative;height:0;border-top:1.5px dashed rgba(255,255,255,.1);margin:0}
html:not(.dark) .fc-tear{border-top-color:rgba(0,0,0,.08)}
.fc-tear::before,.fc-tear::after{content:'';position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#0D1526;transform:translateY(-50%)}
html:not(.dark) .fc-tear::before,html:not(.dark) .fc-tear::after{background:#EEF3FF}
.fc-tear::before{left:-11px}.fc-tear::after{right:-11px}
.fc-leg-top{display:flex;justify-content:center;padding:12px 20px 0}
.fc-leg-badge{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.8px;font-family:'Courier New',monospace}
html:not(.dark) .fc-leg-badge{color:rgba(0,0,0,.3)}

// ─── PIN auth ──────────────────────────────────────────────────
var PIN_SK = 'flowz_equipe_pin';

var _correctPin = '1234'; // fallback default

(function initPin(){
  try {
    if (sessionStorage.getItem(PIN_SK) === '1') { unlockContent(); return; }
  } catch(e){}
  // Fetch PIN from Supabase
  fetch(SUPABASE_URL + '/rest/v1/app_config?key=eq.team_pin&select=value&limit=1', {

  }).catch(function(){});

})();

function pinPress(digit) {
  if (_pinBuffer.length >= 4) return;
  _pinBuffer += digit;
  renderPinDots(false);
  if (_pinBuffer.length === 4) setTimeout(pinSubmit, 80);
}

function pinDel() {
  if (!_pinBuffer.length) return;
  _pinBuffer = _pinBuffer.slice(0, -1);
  renderPinDots(false);
}

function renderPinDots(err) {
  for (var i = 0; i < 4; i++) {
    var d = document.getElementById('pd' + i);
    d.className = 'pin-dot' + (i < _pinBuffer.length ? (err ? ' err' : ' filled') : '');
  }
}

function pinSubmit() {
  if (_pinBuffer.length < 4) return;
  if (_pinBuffer === _correctPin) {
    try { sessionStorage.setItem(PIN_SK, '1'); } catch(e){}
    unlockContent();
  } else {
    renderPinDots(true);
    var dots = document.getElementById('pin-dots');
    dots.classList.add('shake');
    dots.addEventListener('animationend', function(){ dots.classList.remove('shake'); }, { once: true });
    document.getElementById('pin-err').textContent = 'PIN incorreto';
    setTimeout(function(){
      _pinBuffer = '';
      renderPinDots(false);
      document.getElementById('pin-err').textContent = '';
    }, 900);
  }
}

function unlockContent() {
  var overlay = document.getElementById('pin-overlay');
  overlay.classList.add('hide');
  setTimeout(function(){ overlay.style.display = 'none'; }, 380);
}

});

var DAYS_FULL = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var DAYS_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function airportCity(iata){if(!iata)return '';var a=AIRPORTS[iata.toUpperCase()];return a?a.city:iata;}
function airportLabel(iata){if(!iata)return '';var a=AIRPORTS[iata.toUpperCase()];return a?iata+' — '+a.city:iata;}
function flightSubtract(hhmm,mins){var parts=hhmm.split(':');var h=parseInt(parts[0]);var m=parseInt(parts[1]);var total=h*60+m-mins;total=((total%1440)+1440)%1440;return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');}
function calcLayover(arrDate,arrTime,depDate,depTime){if(!arrTime||!depTime)return null;var ah=parseInt(arrTime.split(':')[0]);var am=parseInt(arrTime.split(':')[1]);var dh=parseInt(depTime.split(':')[0]);var dm=parseInt(depTime.split(':')[1]);var diff=(dh*60+dm)-(ah*60+am);if(arrDate&&depDate){var d1=new Date(arrDate+'T00:00:00');var d2=new Date(depDate+'T00:00:00');diff+=(Math.round((d2-d1)/86400000))*24*60;}else if(diff<=0){diff+=24*60;}if(diff<=0)return null;var days=Math.floor(diff/(24*60));var rem=diff%(24*60);var h2=Math.floor(rem/60);var m2=rem%60;var s=String(h2).padStart(2,'0')+'h'+String(m2).padStart(2,'0');return days>0?days+'d '+s:s;}
function shortDay(d){if(!d)return '—';try{var dt=new Date(d+'T12:00:00');var dd=String(dt.getDate()).padStart(2,'0');var mm=String(dt.getMonth()+1).padStart(2,'0');return dd+'/'+mm+' · '+DAYS_SHORT[dt.getDay()];}catch(e){return esc(d);}}
function withDay(d){if(!d)return '';try{var dt=new Date(d+'T12:00:00');var dd=String(dt.getDate()).padStart(2,'0');var mm=String(dt.getMonth()+1).padStart(2,'0');var yyyy=dt.getFullYear();return dd+'/'+mm+'/'+yyyy+' · '+DAYS_FULL[dt.getDay()];}catch(e){return esc(d);}}

// Check if a HH:MM time string is within 30 minutes from now
function isUrgentTime(hhmm) {
  if (!hhmm) return false;
  try {
    var now = new Date();
    var nowMins = now.getHours() * 60 + now.getMinutes();
    var parts = hhmm.split(':');
    var depMins = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    var diff = depMins - nowMins;
    return diff >= 0 && diff <= 30;
  } catch(e) { return false; }
}

// Copy localizador
function copyLoc(btn, code) {
  navigator.clipboard.writeText(code).then(function() {
    btn.textContent = 'Copiado ✓';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = 'Copiar';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(function() {
    // Fallback for browsers without clipboard API
    try {
      var ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = 'Copiado ✓';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = 'Copiar';
        btn.classList.remove('copied');
      }, 2000);
    } catch(e2) {}
  });
}

    + '</div></div>'
    + (loc.isNewFlight ? '<div class="loc-meta">'
      + (loc.airline ? '<div class="row"><span class="lbl">Companhia</span><span class="val">' + esc(loc.airline) + (loc.flightNumberLocator ? ' · ' + esc(loc.flightNumberLocator) : '') + '</span></div>' : '')
      + ((loc.origin || loc.destination) ? '<div class="row"><span class="lbl">Rota</span><span class="val">' + (esc(airportLabel(loc.origin)) || '—') + ' → ' + (esc(airportLabel(loc.destination)) || '—') + '</span></div>' : '')
      + (loc.flightDate ? '<div class="row"><span class="lbl">Data</span><span class="val">' + withDay(loc.flightDate) + '</span></div>' : '')
      + (loc.flightTimeLocator ? '<div class="boarding-banner" style="margin:8px 0 0"><span class="boarding-cell">🛫 Embarque: <strong>' + flightSubtract(loc.flightTimeLocator, 45) + '</strong></span><span class="boarding-cell">🧳 Despacho: <strong>' + flightSubtract(loc.flightTimeLocator, 120) + '</strong></span></div>' : '')
      + '</div>' : '')
    + '<div class="pax-list">' + ((loc.passengers||[]).filter(Boolean).map(function(p) { return '<div class="pax-row">• ' + esc(p) + '</div>'; }).join('') || '<div class="pax-row muted">Nenhum passageiro</div>') + '</div>'
    + '</div>';
}

function routeStrip(origin, dest, depTime, arrTime, depDate, cityFn, direct) {
  return '<div class="fc-strip">'
    + '<div class="fc-airport">'
    + (depDate ? '<div class="fc-date-row">' + shortDay(depDate) + '</div>' : '')
    + '<div class="fc-iata">' + esc(origin || '???') + '</div>'

    + '<div class="fc-time">' + (depTime ? esc(depTime) : '--:--') + '</div>'
    + '</div>'

function buildFlightSection(s, label) {
  if (!s.hasAirplane) return '';
  var cityFn = function(iata) { return esc(airportCity(iata) || iata || ''); };
  var head = '<div class="flight-card fade-in">'
    + '<div class="fc-head">'
    + '<div class="fc-label">✈ ' + esc(label) + '</div>'
    + (s.flightNumber ? '<div class="fc-fnum">VOO ' + esc(s.flightNumber) + '</div>' : '')
    + '</div>';
  if (!s.hasEscala) {
    return head
      + '<div class="fc-route">'
      + routeStrip(s.airportName, s.airportDestination, s.flightTime, s.flightArrivalTime, s.flightDate, cityFn, true)
      + '</div></div>';
  }
  var legs = s.flightLegs || [];
  if (!legs.length) return '';
  var legsHtml = legs.map(function(leg, i) {
    var sep = i > 0 ? '<div class="fc-tear"></div>' : '';
    var badge = (leg.airline || leg.flightNumber)
      ? '<div class="fc-leg-top"><div class="fc-leg-badge">' + esc([leg.airline, leg.flightNumber].filter(Boolean).join(' · ')) + '</div></div>'
      : '';
    var layover = i < legs.length - 1
      ? '<div class="fc-layover">⏳ Conexão em ' + cityFn(leg.destination) + '</div>'
      : '';
    return sep + badge
      + '<div class="fc-route">'
      + routeStrip(leg.origin, leg.destination, leg.time, leg.arrivalTime, leg.date, cityFn, false)
      + '</div>' + layover;
  }).join('');
  return head + legsHtml + '</div>';
}

function initIntersectionObserver() {
  if (!('IntersectionObserver' in window)) {
    // Fallback: show all immediately
    document.querySelectorAll('.fade-in').forEach(function(el) { el.classList.add('visible'); });
    return;
  }
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry, i) {
      if (entry.isIntersecting) {
        var el = entry.target;
        var delay = parseFloat(el.dataset.delay || 0);
        setTimeout(function() { el.classList.add('visible'); }, delay);
        observer.unobserve(el);
      }
    });
  }, { threshold: 0.08 });

  document.querySelectorAll('.fade-in').forEach(function(el, i) {
    el.dataset.delay = Math.min(i * 60, 300);
    observer.observe(el);
  });
}

function applyUrgentTimes() {

async function fetchWeather(city, date) {
  try {
    var cityClean = city.split(',')[0].split(' - ')[0].split(' / ')[0].trim();

    // Geocode city → lat/lon
    var geoRes = await fetch(
      'https://geocoding-api.open-meteo.com/v1/search?name=' +
      encodeURIComponent(cityClean) +
      '&count=5&language=pt&format=json&countryCode=BR'
    );
    if (!geoRes.ok) return null;
    var geoData = await geoRes.json();
    if (!geoData.results || !geoData.results.length) return null;
    var loc = geoData.results.find(function(r) { return r.country_code === 'BR'; })
              || geoData.results[0];

    // Determina se a data é passada ou futura para escolher o endpoint correto.
    // forecast só funciona até ~16 dias à frente; para datas passadas usa archive.
    var today = new Date(); today.setHours(0,0,0,0);
    var showDate = new Date(date + 'T00:00:00');
    var diffDays = Math.round((showDate - today) / 86400000);
    var apiBase = diffDays < 0
      ? 'https://archive-api.open-meteo.com/v1/archive'
      : 'https://api.open-meteo.com/v1/forecast';
    if (diffDays > 16) return null; // fora do alcance da previsão

    // Archive API does not support precipitation_probability_max
    var dailyFields = diffDays < 0
      ? 'weather_code,temperature_2m_max,temperature_2m_min'
      : 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max';
    var fRes = await fetch(
      apiBase + '?' +
      'latitude=' + loc.latitude + '&longitude=' + loc.longitude +
      '&daily=' + dailyFields +
      '&start_date=' + date + '&end_date=' + date +
      '&timezone=America%2FSao_Paulo'
    );
    if (!fRes.ok) return null;
    var fData = await fRes.json();
    if (!fData.daily || !fData.daily.time || !fData.daily.time.length) return null;

    var code = fData.daily.weather_code ? fData.daily.weather_code[0] : 0;
    var rain = diffDays < 0 ? 0 : ((fData.daily.precipitation_probability_max && fData.daily.precipitation_probability_max[0]) || 0);
    return {
      icon: WMO_ICON[code] !== undefined ? WMO_ICON[code] : '🌡️',
      label: WMO_LABEL[code] || 'Clima',
      max: Math.round(fData.daily.temperature_2m_max[0]),
      min: Math.round(fData.daily.temperature_2m_min[0]),
      rain: rain,
      city: cityClean,
      approx: diffDays < 0,
    };
  } catch(e) { return null; }
}

function renderWeather(w) {
  var card = document.getElementById('weather-card');
  if (!card) return;
  if (!w) { card.style.display = 'none'; return; }
  document.getElementById('w-icon').textContent = w.icon;
  document.getElementById('w-label').textContent = w.label + (w.approx ? ' (estimado)' : '');
  var rainStr = w.rain >= 10 ? ' · ' + w.rain + '% de chuva' : '';
  document.getElementById('w-meta').textContent = w.city + rainStr;
  document.getElementById('w-temp').innerHTML = w.max + '°<span class="w-min">mín ' + w.min + '°</span>';
  card.style.display = 'flex';
  card.classList.add('visible');
}

async function fetchShow(id) {
  var url = SUPABASE_URL + '/rest/v1/shows?id=eq.' + encodeURIComponent(id) + '&select=*&limit=1';
  var res = await fetch(url, {headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var rows = await res.json();
  if (!rows.length) throw new Error('Show não encontrado');
  return rows[0].data;
}

async function main() {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if (!id) {
    window.location.replace('proximos.html');
    return;
  }
  try {
    var show = await fetchShow(id);
    var returnShow = null;
    if (show.returnFlightFromShowId) {
      try { returnShow = await fetchShow(show.returnFlightFromShowId); } catch(e) {}
    }
    renderShow(show, returnShow);
  } catch(err) {
    document.getElementById('root').innerHTML = '<div id="error-box">❌ Erro ao carregar roteiro: ' + esc(err.message) + '</div>';
    return;
  }

  // ── Realtime: atualiza badge de logística sem reload ──────────────
  try {
    var showId = new URLSearchParams(location.search).get('id');
    supabaseClient
      .channel('show-logistics-' + showId)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'shows', filter: 'id=eq.' + showId }, function(payload) {
        var newData = payload.new && payload.new.data;
        if (!newData) return;
        var badge = document.getElementById('logistics-ok-badge');
        if (!badge) return;
        if (newData.logisticsFinalized) {
          badge.style.display = '';
          badge.innerHTML = '<div class="vb-core"><span class="vb-sq r0"></span><span class="vb-sq r22"></span><span class="vb-sq r45"></span><span class="vb-sq r67"></span><svg class="vb-ck" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
          badge.className = '';
        } else {
          badge.style.display = 'none';
        }
      })
      .subscribe();
  } catch(e) {}
}

// ─── Auto-update via version.json polling ────────────────────
var _baseVid=null,_updateScheduled=false;
function doUpdate(){
  var p=Promise.resolve();
  if('caches' in window)p=caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));});
  p.then(function(){
    if('serviceWorker' in navigator)return navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));});
  }).then(function(){location.reload();}).catch(function(){location.reload();});
}
function checkVersion(){
  fetch('/version.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      var bid=d&&typeof d.buildId==='string'?d.buildId:null;
      if(!bid||bid==='__BUILD_ID__')return;
      if(_baseVid===null){_baseVid=bid;return;}
      if(bid!==_baseVid&&!_updateScheduled){
        _updateScheduled=true;
        document.getElementById('update-banner').style.display='flex';
        setTimeout(doUpdate,5000);
      }
    }).catch(function(){});
}
checkVersion();
setInterval(checkVersion,30*1000);
window.addEventListener('focus',checkVersion);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkVersion();});
// ─────────────────────────────────────────────────────────────

main();

if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.type==='RELOAD')location.reload();});}
