<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tesla · iOS Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
<style>
  :root {
    --brand: #6C63FF;
    --brand-2: #8B83FF;
    --brand-glow: rgba(108,99,255,.35);
    --danger: #FF3B30;
    --success: #34C759;
    --warning: #FF9500;

    /* iOS dark */
    --d-bg: #000000;
    --d-grouped-bg: #000000;
    --d-surface: #1C1C1E;
    --d-surface-2: #2C2C2E;
    --d-surface-3: #3A3A3C;
    --d-separator: rgba(84,84,88,.65);
    --d-separator-op: rgba(255,255,255,.07);
    --d-label: #FFFFFF;
    --d-label-2: rgba(235,235,245,.60);
    --d-label-3: rgba(235,235,245,.30);
    --d-fill: rgba(120,120,128,.24);
    --d-fill-2: rgba(118,118,128,.12);

    /* iOS light */
    --l-bg: #F2F2F7;
    --l-grouped-bg: #F2F2F7;
    --l-surface: #FFFFFF;
    --l-surface-2: #F9F9F9;
    --l-surface-3: #E5E5EA;
    --l-separator: rgba(60,60,67,.36);
    --l-separator-op: rgba(60,60,67,.12);
    --l-label: #000000;
    --l-label-2: rgba(60,60,67,.60);
    --l-label-3: rgba(60,60,67,.30);
    --l-fill: rgba(120,120,128,.20);
    --l-fill-2: rgba(120,120,128,.12);
  }

  html[data-theme="dark"] {
    --bg: var(--d-bg);
    --grouped-bg: var(--d-grouped-bg);
    --surface: var(--d-surface);
    --surface-2: var(--d-surface-2);
    --surface-3: var(--d-surface-3);
    --separator: var(--d-separator);
    --separator-op: var(--d-separator-op);
    --label: var(--d-label);
    --label-2: var(--d-label-2);
    --label-3: var(--d-label-3);
    --fill: var(--d-fill);
    --fill-2: var(--d-fill-2);
    --tabbar: rgba(20,20,20,.72);
    --nav: rgba(10,10,10,.78);
    --sheet-handle: rgba(235,235,245,.3);
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg: var(--l-bg);
    --grouped-bg: var(--l-grouped-bg);
    --surface: var(--l-surface);
    --surface-2: var(--l-surface-2);
    --surface-3: var(--l-surface-3);
    --separator: var(--l-separator);
    --separator-op: var(--l-separator-op);
    --label: var(--l-label);
    --label-2: var(--l-label-2);
    --label-3: var(--l-label-3);
    --fill: var(--l-fill);
    --fill-2: var(--l-fill-2);
    --tabbar: rgba(249,249,249,.78);
    --nav: rgba(249,249,249,.80);
    --sheet-handle: rgba(60,60,67,.3);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0A0A0F;
    color: var(--label);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    letter-spacing: -0.01em;
  }

  /* Desktop showcase chrome */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,.12), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(139,131,255,.08), transparent 60%),
      #060611;
    padding: 32px;
  }

  .controls {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .control-btn {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all .2s ease;
    letter-spacing: -0.01em;
  }
  .control-btn:hover { background: rgba(255,255,255,.14); }
  .control-btn.active { background: var(--brand); border-color: var(--brand); }

  .brand-label {
    position: fixed;
    top: 24px;
    left: 32px;
    color: rgba(255,255,255,.6);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 100;
  }
  .brand-label b { color: #fff; letter-spacing: 2px; }

  /* Phone device */
  .device {
    width: 390px;
    height: 844px;
    border-radius: 56px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 11px #1a1a1f,
      0 0 0 12px #2a2a32,
      0 40px 80px rgba(0,0,0,.6),
      0 0 60px rgba(108,99,255,.15);
    transform-origin: center;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    padding: 18px 32px 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
    pointer-events: none;
  }
  .status-time {
    font-size: 17px;
    font-weight: 600;
    color: var(--label);
    font-family: -apple-system, 'SF Pro Display', system-ui;
    letter-spacing: -0.02em;
  }
  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--label);
  }
  .status-icons svg { display: block; }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 125px;
    height: 37px;
    background: #000;
    border-radius: 999px;
    z-index: 60;
  }

  /* Screen viewport */
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    overflow: hidden;
    background: var(--bg);
  }
  .screen.active { display: block; }

  .screen-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .screen-scroll::-webkit-scrollbar { display: none; }

  /* iOS Navigation bar (blur) */
  .nav-bar {
    position: sticky;
    top: 0;
    background: var(--nav);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    padding: 54px 16px 8px 16px;
    z-index: 40;
    border-bottom: .5px solid transparent;
    transition: border-color .2s;
  }
  .nav-bar.scrolled { border-bottom-color: var(--separator); }
  .nav-bar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
  }
  .nav-title-compact {
    font-size: 17px;
    font-weight: 600;
    color: var(--label);
    opacity: 0;
    transition: opacity .2s;
    letter-spacing: -0.02em;
  }
  .nav-bar.scrolled .nav-title-compact { opacity: 1; }
  .nav-btn {
    color: var(--brand);
    font-size: 17px;
    font-weight: 400;
    background: none;
    border: none;
    padding: 0 4px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn.done { font-weight: 600; }
  .nav-btn svg { display: block; }

  /* Large title (iOS) */
  .large-title {
    padding: 4px 20px 12px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--label);
    line-height: 1.1;
  }

  /* Tab bar */
  .tab-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 83px;
    background: var(--tabbar);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-top: .5px solid var(--separator);
    display: flex;
    padding: 4px 0 24px;
    z-index: 45;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--label-2);
    cursor: pointer;
    transition: color .15s;
    padding-top: 4px;
  }
  .tab-item.active { color: var(--brand); }
  .tab-item svg { width: 26px; height: 26px; }
  .tab-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  /* FAB (floating primary action, iOS-style) */
  .fab {
    position: absolute;
    right: 16px;
    bottom: 100px;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(108,99,255,.45), 0 4px 12px rgba(0,0,0,.3);
    cursor: pointer;
    z-index: 44;
    transition: transform .15s, box-shadow .15s;
    color: #fff;
  }
  .fab:active { transform: scale(.94); }

  /* Lists (iOS grouped) */
  .section {
    padding: 0 20px;
    margin-bottom: 24px;
  }
  .section-header {
    padding: 20px 16px 6px;
    font-size: 13px;
    font-weight: 400;
    color: var(--label-2);
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .list-group {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    min-height: 44px;
    border-bottom: .5px solid var(--separator-op);
    cursor: pointer;
    background: var(--surface);
    transition: background .1s;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:active { background: var(--surface-2); }
  .list-icon-wrap {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .list-content { flex: 1; min-width: 0; }
  .list-title {
    font-size: 17px;
    font-weight: 400;
    color: var(--label);
    letter-spacing: -0.02em;
  }
  .list-subtitle {
    font-size: 13px;
    color: var(--label-2);
    margin-top: 1px;
    letter-spacing: -0.01em;
  }
  .list-value {
    font-size: 17px;
    color: var(--label-2);
    letter-spacing: -0.02em;
  }
  .list-chevron {
    color: var(--label-3);
    font-size: 20px;
    font-weight: 300;
    margin-left: auto;
    flex-shrink: 0;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform .1s, background .15s;
  }
  .card:active { transform: scale(.98); }

  /* Segmented control (iOS) */
  .segmented {
    display: flex;
    background: var(--fill-2);
    border-radius: 9px;
    padding: 2px;
    margin: 0 20px 16px;
    position: relative;
  }
  .segmented-item {
    flex: 1;
    padding: 7px 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--label);
    cursor: pointer;
    border-radius: 7px;
    transition: all .2s;
    letter-spacing: -0.01em;
    z-index: 1;
    position: relative;
  }
  .segmented-item.active {
    background: var(--surface);
    box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
    font-weight: 600;
  }
  html[data-theme="dark"] .segmented-item.active {
    background: var(--surface-3);
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
  }

  /* Pills / chips */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* Tab bar scroll-hidden helpers */
  .screen-scroll { padding-bottom: 100px; }

  /* Utility */
  .mono-time {
    font-family: -apple-system, 'SF Pro Display', system-ui;
    font-variant-numeric: tabular-nums;
  }

  /* Tweaks panel */
  .tweaks {
    position: fixed;
    bottom: 24px;
    left: 24px;
    background: rgba(28,28,32,.92);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 16px;
    padding: 14px 16px;
    color: #fff;
    font-size: 12px;
    z-index: 100;
    max-width: 260px;
  }
  .tweaks h4 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,.6);
  }
  .tweaks p {
    margin: 0;
    font-size: 12px;
    color: rgba(255,255,255,.7);
    line-height: 1.5;
  }
  .tweaks kbd {
    background: rgba(255,255,255,.12);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: -apple-system, monospace;
  }

  /* Animations */
  @keyframes slideUpIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen.active > .screen-scroll > * { opacity: 1; animation: slideUpIn .35s cubic-bezier(.22,1,.36,1) both; }
  .screen.active > .screen-scroll > *:nth-child(2) { animation-delay: .04s; }
  .screen.active > .screen-scroll > *:nth-child(3) { animation-delay: .08s; }
  .screen.active > .screen-scroll > *:nth-child(4) { animation-delay: .12s; }
  .screen.active > .screen-scroll > *:nth-child(5) { animation-delay: .16s; }

  /* Responsive: small screens show just phone */
  @media (max-width: 520px) {
    .stage { padding: 0; gap: 0; }
    .device { transform: scale(1); border-radius: 0; box-shadow: none; width: 100%; height: 100%; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand-label"><b>Tesla</b> · iOS Refresh · VoltZ</div>
  <div class="controls">
    <button class="control-btn" id="theme-toggle">
      <span id="theme-icon">🌙</span> <span id="theme-label">Dark</span>
    </button>
  </div>

  <div class="device" id="device">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <!-- signal -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
          <rect x="0" y="8" width="3" height="4" rx=".5"/>
          <rect x="5" y="6" width="3" height="6" rx=".5"/>
          <rect x="10" y="3" width="3" height="9" rx=".5"/>
          <rect x="15" y="0" width="3" height="12" rx=".5"/>
        </svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
          <path d="M8.5 11.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4zM4.2 7.9C5.4 6.8 6.9 6.2 8.5 6.2s3.1.6 4.3 1.7l1.4-1.4C12.7 5.1 10.7 4.3 8.5 4.3c-2.2 0-4.2.8-5.7 2.2l1.4 1.4zM.7 4.4C2.9 2.3 5.6 1.2 8.5 1.2s5.6 1.1 7.8 3.2l-1.4 1.4c-1.7-1.6-3.9-2.5-6.4-2.5s-4.7.9-6.4 2.5L.7 4.4z"/>
        </svg>
        <!-- battery -->
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
          <rect x=".5" y=".5" width="22" height="12" rx="3" stroke="currentColor" stroke-opacity=".4"/>
          <rect x="2" y="2" width="19" height="9" rx="1.5" fill="currentColor"/>
          <rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor" fill-opacity=".4"/>
        </svg>
      </div>
    </div>

    <!-- Screens injected by JS -->
    <div id="screens"></div>

    <!-- Tab bar -->
    <div class="tab-bar" id="tab-bar"></div>
  </div>
</div>

<div class="tweaks">
  <h4>Dicas de navegação</h4>
  <p>Toque nos cards para abrir detalhes. Use a <b>tab bar</b> para trocar de seção. Botão no topo direito alterna tema.</p>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
